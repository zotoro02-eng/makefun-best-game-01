<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Harvest — gather the light, blast the gloom</title>
<link rel="icon" href="data:,">
<style>
  /* The page is only a frame for the canvas: no external fonts, no
     network, nothing but the game itself. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05070f; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    background: #0a0e1a;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
